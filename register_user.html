<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32x32.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="위치현황">
<link rel="stylesheet" href="./pwa.css">
<script src="./mobile-back.js"></script>
<script src="./pwa.js" defer></script>
<title>회원가입</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="config.js"></script>
<script src="toast.js"></script>
<script src="auth.js"></script>

<style>
:root{
    --bg:#eef2f7;
    --surface:#ffffff;
    --line:#e2e8f0;
    --text:#0f172a;
    --muted:#64748b;
    --primary:#2563eb;
    --primary-dark:#1e3a8a;
    --navy:#0f172a;
    --shadow:0 10px 28px rgba(15,23,42,.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html{-webkit-text-size-adjust:100%;}

body{
    min-height:100vh;
    min-height:100dvh;
    padding:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    color:var(--text);
    background:
        radial-gradient(circle at top,rgba(37,99,235,.11),transparent 34%),
        var(--bg);
}

button,input{font:inherit;}

.register-box{
    width:100%;
    max-width:420px;
    padding:35px 25px;
    border:1px solid rgba(226,232,240,.95);
    border-radius:18px;
    background:var(--surface);
    box-shadow:var(--shadow);
}

.title{
    margin-bottom:30px;
    text-align:center;
    color:var(--text);
    font-size:28px;
    font-weight:700;
    letter-spacing:-.45px;
}

.input{
    width:100%;
    height:54px;
    margin-bottom:15px;
    padding:0 16px;
    border:1px solid var(--line);
    border-radius:10px;
    outline:none;
    background:#fff;
    color:var(--text);
    font-size:16px;
    transition:border-color .16s ease,box-shadow .16s ease;
}

.input::placeholder{color:#94a3b8;}
.input[readonly]{cursor:pointer;background:#f8fafc;}

.input:focus{
    border-color:#93c5fd;
    box-shadow:0 0 0 4px rgba(37,99,235,.10);
}

.register-btn{
    width:100%;
    height:54px;
    margin-top:5px;
    border:0;
    border-radius:10px;
    background:linear-gradient(145deg,var(--navy),var(--primary-dark) 70%,var(--primary));
    color:#fff;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(30,58,138,.20);
}

.register-btn:active{transform:scale(.98);}
.register-btn:disabled{cursor:default;opacity:.65;transform:none;}

.back{margin-top:20px;text-align:center;}
.back a{color:var(--primary-dark);text-decoration:none;font-weight:600;}
.back a:hover{text-decoration:underline;}

.message{
    height:18px;
    margin-top:-10px;
    margin-bottom:12px;
    font-size:12px;
    line-height:18px;
}

.guide,.date-guide{color:var(--primary);}
.date-guide{margin-top:-10px;margin-bottom:12px;font-size:12px;line-height:16px;}
.error{color:#dc2626;visibility:hidden;}

.reapply-notice{
    margin-bottom:16px;
    padding:12px;
    border:1px solid #bfdbfe;
    border-radius:12px;
    background:#eff6ff;
    color:#1d4ed8;
    text-align:center;
    font-size:14px;
    font-weight:700;
    line-height:1.55;
}

.saved-info{
    margin-bottom:16px;
    padding:12px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#f8fafc;
    color:#475569;
    font-size:12px;
    line-height:1.65;
}

.hidden{display:none!important;}

@media(max-width:420px){
    body{align-items:flex-start;}
    .register-box{padding:30px 20px;margin:auto 0;}
    .title{font-size:26px;}
}
</style>
</head>
<body>

<div class="register-box">
    <div class="title" id="pageTitle">회원가입</div>
    <div id="reapplyNotice" class="reapply-notice hidden">반려된 회원가입 신청을 다시 제출합니다.</div>
    <div id="savedInfo" class="saved-info hidden"></div>

    <input type="email" id="email" class="input" placeholder="이메일" autocomplete="email">

    <input type="password" id="password" class="input" placeholder="비밀번호" autocomplete="new-password">
    <div id="pwGuide" class="message guide">*8~15글자, 숫자 포함</div>

    <input type="password" id="password-confirm" class="input" placeholder="비밀번호 확인" autocomplete="new-password">
    <div id="pwCheckMsg" class="message error">*비밀번호가 불일치합니다.</div>

    <input type="text" id="name" class="input" placeholder="이름" autocomplete="name">
    <input type="tel" id="phone" class="input" placeholder="휴대폰 번호 (01012345678)" inputmode="numeric" autocomplete="tel">
    <input type="text" id="unit" class="input" placeholder="부대 선택" readonly>
    <input type="date" id="enlistDate" class="input" aria-label="입대일">
    <p id="enlistGuide" class="date-guide">*입대일 입력</p>
    <input type="date" id="dischargeDate" class="input" aria-label="전역일">
    <p id="dischargeGuide" class="date-guide">*전역일 입력</p>

    <button id="registerBtn" class="register-btn" type="button">회원가입</button>

    <div class="back">
        <a href="index.html">← 로그인으로</a>
    </div>
</div>

<div id="unitModal" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center z-50 p-5">
    <div class="bg-white rounded-2xl w-full max-w-md max-h-[80vh] flex flex-col overflow-hidden shadow-2xl">
        <div class="p-4 text-lg font-bold text-center border-b border-slate-200 text-slate-900">부대 선택</div>
        <div class="p-4">
            <input id="unitSearch" type="text" placeholder="부대찾기" class="w-full border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-300">
        </div>
        <div id="unitList" class="flex-1 overflow-y-auto"></div>
        <button id="closeUnitModal" type="button" class="p-4 bg-slate-100 text-slate-700 font-semibold active:bg-slate-200">닫기</button>
    </div>
</div>

<script>
const email=document.getElementById("email");
const password=document.getElementById("password");
const passwordConfirm=document.getElementById("password-confirm");
const nameInput=document.getElementById("name");
const phone=document.getElementById("phone");
const unit=document.getElementById("unit");
const enlistDate=document.getElementById("enlistDate");
const dischargeDate=document.getElementById("dischargeDate");
const registerBtn=document.getElementById("registerBtn");
const pwCheckMsg=document.getElementById("pwCheckMsg");
const pwGuide=document.getElementById("pwGuide");
const savedInfo=document.getElementById("savedInfo");
const enlistGuide=document.getElementById("enlistGuide");
const dischargeGuide=document.getElementById("dischargeGuide");

const unitModal=document.getElementById("unitModal");
const unitSearch=document.getElementById("unitSearch");
const unitList=document.getElementById("unitList");
const closeUnitModal=document.getElementById("closeUnitModal");

const passwordRegex=/^(?=.*\d).{8,15}$/;
const phoneRegex=/^01[0-9]{8,9}$/;

let selectedUnitId=null;
let registering=false;
let reapplyMode=false;

function checkPassword(){
    if(passwordConfirm.value.length===0){
        pwCheckMsg.style.visibility="hidden";
        return;
    }

    pwCheckMsg.style.visibility=
        password.value===passwordConfirm.value ? "hidden" : "visible";
}

function escapeHtml(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function closeUnitPicker(){
    unitModal.classList.add("hidden");
    unitModal.classList.remove("flex");
}

async function loadUnits(keyword=""){
    keyword=keyword.trim();

    let query=sb
        .from("units")
        .select("id,unit_name,unit_code")
        .order("unit_name");

    if(keyword!==""){
        query=query.or(`unit_name.ilike.*${keyword}*,unit_code.ilike.*${keyword}*`);
    }

    const {data,error}=await query;

    if(error){
        console.error(error);
        unitList.innerHTML='<div class="text-center text-red-500 py-6">부대를 불러오지 못했습니다.</div>';
        return;
    }

    if(!data || data.length===0){
        unitList.innerHTML='<div class="text-center text-slate-500 py-6">검색 결과가 없습니다.</div>';
        return;
    }

    unitList.innerHTML="";

    data.forEach(item=>{
        const button=document.createElement("button");
        button.type="button";
        button.className="w-full text-left px-4 py-4 border-b border-slate-100 hover:bg-slate-50 active:bg-slate-100";

        const label=document.createElement("div");
        label.className="font-semibold text-slate-900";
        label.textContent=`${item.unit_name} (${item.unit_code})`;
        button.appendChild(label);

        button.addEventListener("click",()=>{
            selectedUnitId=item.id;
            unit.value=`${item.unit_name} (${item.unit_code})`;
            closeUnitPicker();
        });

        unitList.appendChild(button);
    });
}

async function waitForProfile(userId){
    for(let attempt=0;attempt<10;attempt+=1){
        const {data:profile,error}=await sb
            .from("profiles")
            .select("id")
            .eq("id",userId)
            .maybeSingle();

        if(error) console.error(error);
        if(profile) return true;

        await new Promise(resolve=>setTimeout(resolve,200));
    }

    return false;
}

async function prepareReapplyMode(){
    const urlParams=new URLSearchParams(location.search);
    const {data:{session},error:sessionError}=await getSession();

    if(sessionError || !session || !urlParams.has("reapply")) return;

    const {data:profile,error}=await getProfile(session.user.id);

    if(
        error ||
        !profile ||
        profile.role!=="user" ||
        profile.user_approved===true
    ) return;

    reapplyMode=true;

    document.getElementById("pageTitle").textContent="회원가입 재신청";
    document.getElementById("reapplyNotice").classList.remove("hidden");
    registerBtn.textContent="회원가입 재신청";
    email.value=session.user.email || "";

    savedInfo.innerHTML=`
        <p class="font-bold text-slate-900 mb-1">기존 계정 정보는 그대로 유지됩니다.</p>
        <p>이메일: ${escapeHtml(session.user.email || "")}</p>
        <p>이름: ${escapeHtml(profile.name || session.user.user_metadata?.display_name || "")}</p>
        <p>휴대폰: ${escapeHtml(profile.phone || "")}</p>
    `;
    savedInfo.classList.remove("hidden");

    email.style.display="none";
    password.style.display="none";
    passwordConfirm.style.display="none";
    pwGuide.style.display="none";
    pwCheckMsg.style.display="none";
    nameInput.style.display="none";
    phone.style.display="none";
    enlistDate.style.display="none";
    dischargeDate.style.display="none";
    enlistGuide.style.display="none";
    dischargeGuide.style.display="none";

    selectedUnitId=null;
    unit.value="";
    unit.placeholder="부대 다시 선택";
}

async function submitReapply(){
    const {error}=await sb.rpc("reapply_user_application",{
        p_unit_id:selectedUnitId
    });

    if(error){
        triggerToast("재신청 실패\n"+error.message);
        return false;
    }

    triggerToast("회원가입 신청이 완료되었습니다.\n관리자의 승인을 기다려주세요.");
    await logout();
    setTimeout(()=>location.replace("index.html"),1500);
    return true;
}

password.addEventListener("input",checkPassword);
passwordConfirm.addEventListener("input",checkPassword);

unit.addEventListener("click",()=>{
    unitSearch.value="";
    unitModal.classList.remove("hidden");
    unitModal.classList.add("flex");
    loadUnits();
    setTimeout(()=>unitSearch.focus(),80);
});

unitSearch.addEventListener("input",()=>loadUnits(unitSearch.value));
closeUnitModal.addEventListener("click",closeUnitPicker);
unitModal.addEventListener("click",event=>{
    if(event.target===unitModal) closeUnitPicker();
});

registerBtn.addEventListener("click",async()=>{
    if(registering) return;

    const emailValue=email.value.trim();
    const phoneNumber=phone.value.replace(/\D/g,"");

    if(!reapplyMode && emailValue===""){
        triggerToast("이메일을 입력하세요.");
        email.focus();
        return;
    }

    if(!reapplyMode){
        if(!passwordRegex.test(password.value)){
            triggerToast("비밀번호는 8~15글자이며\n숫자를 포함해야 합니다.");
            password.focus();
            return;
        }

        if(password.value!==passwordConfirm.value){
            triggerToast("비밀번호가 일치하지 않습니다.");
            passwordConfirm.focus();
            return;
        }

        if(nameInput.value.trim()===""){
            triggerToast("이름을 입력하세요.");
            nameInput.focus();
            return;
        }

        if(!phoneRegex.test(phoneNumber)){
            triggerToast("휴대폰 번호를 정확히 입력하세요.");
            phone.focus();
            return;
        }
    }

    if(selectedUnitId===null){
        triggerToast("부대를 선택하세요.");
        return;
    }

    if(!reapplyMode){
        if(enlistDate.value===""){
            triggerToast("입대일을 입력하세요.");
            enlistDate.focus();
            return;
        }

        if(dischargeDate.value===""){
            triggerToast("전역일을 입력하세요.");
            dischargeDate.focus();
            return;
        }

        if(new Date(enlistDate.value)>new Date(dischargeDate.value)){
            triggerToast("입대일은 전역일보다\n늦을 수 없습니다.");
            enlistDate.focus();
            return;
        }
    }

    registering=true;
    registerBtn.disabled=true;
    registerBtn.textContent=reapplyMode ? "재신청 중..." : "신청 중...";

    try{
        if(reapplyMode){
            await submitReapply();
            return;
        }

        const {data,error}=await sb.auth.signUp({
            email:emailValue,
            password:password.value,
            options:{
                data:{
                    display_name:nameInput.value.trim(),
                    phone:phoneNumber,
                    role:"user"
                }
            }
        });

        if(error){
            if((error.message || "").toLowerCase().includes("already registered")){
                triggerToast("이미 등록된 이메일입니다.");
            }else{
                triggerToast(error.message || "회원가입에 실패했습니다.");
            }
            return;
        }

        if(!data.user){
            triggerToast("회원 정보를 생성하지 못했습니다.");
            return;
        }

        const ready=await waitForProfile(data.user.id);

        if(!ready){
            triggerToast("프로필 생성에 실패했습니다.\n잠시 후 다시 시도해주세요.");
            return;
        }

        const {error:updateError}=await sb.rpc("submit_user_application",{
            p_unit_id:selectedUnitId,
            p_name:nameInput.value.trim(),
            p_phone:phoneNumber,
            p_enlist_date:enlistDate.value,
            p_discharge_date:dischargeDate.value
        });

        if(updateError){
            triggerToast("회원정보 저장 실패\n"+updateError.message);
            return;
        }

        triggerToast("회원가입 신청이 완료되었습니다.\n관리자의 승인을 기다려주세요.");
        await logout();
        setTimeout(()=>location.replace("index.html"),1500);
    }finally{
        registering=false;
        registerBtn.disabled=false;
        registerBtn.textContent=reapplyMode ? "회원가입 재신청" : "회원가입";
    }
});

window.addEventListener("load",prepareReapplyMode);
</script>
</body>
</html>
