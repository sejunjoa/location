<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32x32.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="위치현황">
<link rel="stylesheet" href="./pwa.css">
<script src="./mobile-back.js"></script>
<script src="./pwa.js" defer></script>
<title>부대 병력 위치현황 비밀번호 재설정</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="toast.js"></script>
<script src="auth.js"></script>

<style>
:root{
    --bg:#eef2f7;
    --surface:#ffffff;
    --line:#e2e8f0;
    --text:#0f172a;
    --muted:#64748b;
    --primary:#2563eb;
    --primary-dark:#1e3a8a;
    --navy:#0f172a;
    --danger:#dc2626;
    --success:#15803d;
    --shadow:0 10px 28px rgba(15,23,42,.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html{-webkit-text-size-adjust:100%;}

body{
    min-height:100vh;
    min-height:100dvh;
    padding:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    color:var(--text);
    background:
        radial-gradient(circle at top,rgba(37,99,235,.11),transparent 34%),
        var(--bg);
}

button,input{font:inherit;}

.reset-box{
    width:100%;
    max-width:420px;
    padding:35px 25px;
    border:1px solid rgba(226,232,240,.95);
    border-radius:18px;
    background:var(--surface);
    box-shadow:var(--shadow);
    opacity:0;
    transform:translateY(24px) scale(.985);
    transition:transform 320ms cubic-bezier(.22,1,.36,1),opacity 220ms ease;
    will-change:transform,opacity;
}

body.reset-popup-visible .reset-box{
    opacity:1;
    transform:translateY(0) scale(1);
}

body.reset-popup-closing .reset-box{
    opacity:0;
    transform:translateY(32px) scale(.98);
}

@media(prefers-reduced-motion:reduce){
    .reset-box{
        transition:none;
    }
}

.title{
    text-align:center;
    color:var(--text);
    font-size:27px;
    font-weight:800;
    letter-spacing:-.45px;
}

.description{
    margin-top:10px;
    color:var(--muted);
    text-align:center;
    font-size:14px;
    font-weight:650;
    line-height:1.6;
}

.status{
    margin-top:22px;
    padding:13px 14px;
    border:1px solid #bfdbfe;
    border-radius:12px;
    background:#eff6ff;
    color:#1d4ed8;
    text-align:center;
    font-size:13px;
    font-weight:750;
    line-height:1.55;
}

.status.error{
    border-color:#fecaca;
    background:#fef2f2;
    color:var(--danger);
}

.status.success{
    border-color:#bbf7d0;
    background:#f0fdf4;
    color:var(--success);
}

.reset-form{
    margin-top:20px;
    display:grid;
    gap:13px;
}

.reset-form[hidden]{display:none;}

.password-field-grid{
    display:grid;
    grid-template-rows:54px 18px;
    gap:0;
    min-height:72px;
}

.password-message{
    height:18px;
    margin:0;
    font-size:12px;
    line-height:18px;
}

.password-guide{
    color:var(--primary);
}

.password-match-error{
    color:var(--danger);
    visibility:hidden;
}

.input{
    width:100%;
    height:54px;
    padding:0 16px;
    border:1px solid var(--line);
    border-radius:10px;
    outline:none;
    background:#fff;
    color:var(--text);
    font-size:16px;
    transition:border-color .16s ease,box-shadow .16s ease;
}

.input::placeholder{color:#94a3b8;}
.input:focus{
    border-color:#93c5fd;
    box-shadow:0 0 0 4px rgba(37,99,235,.10);
}

.reset-btn{
    width:100%;
    height:54px;
    margin-top:2px;
    border:1px solid #93c5fd;
    border-radius:10px;
    background:linear-gradient(145deg,var(--navy),var(--primary-dark) 70%,var(--primary));
    color:#fff;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(30,58,138,.20);
}

.reset-btn:active{transform:scale(.98);}
.reset-btn:disabled{cursor:default;opacity:.58;transform:none;}

.back-link{
    width:100%;
    margin-top:18px;
    border:0;
    background:transparent;
    color:var(--primary);
    font-size:14px;
    font-weight:750;
    cursor:pointer;
}

.back-link:hover{text-decoration:underline;}

@media(max-width:420px){
    .reset-box{padding:30px 20px;}
    .title{font-size:25px;}
}
</style>
</head>
<body>

<main class="reset-box">
    <h1 class="title">비밀번호 재설정</h1>
    <p class="description">새로 사용할 비밀번호를 입력해주세요.</p>

    <div id="recoveryStatus" class="status">비밀번호 재설정 링크를 확인하는 중입니다.</div>

    <form id="resetPasswordForm" class="reset-form" hidden novalidate>
        <div class="password-field-grid">
            <input id="newPassword" class="input" type="password" placeholder="새 비밀번호" autocomplete="new-password">
            <div class="password-message password-guide">*8~15글자, 숫자 포함</div>
        </div>
        <div class="password-field-grid">
            <input id="newPasswordConfirm" class="input" type="password" placeholder="새 비밀번호 확인" autocomplete="new-password">
            <div id="newPasswordCheckMsg" class="password-message password-match-error">*비밀번호가 불일치합니다.</div>
        </div>
        <button id="resetPasswordBtn" class="reset-btn" type="submit">비밀번호 변경</button>
    </form>

    <button id="backToLoginBtn" class="back-link" type="button">로그인으로 돌아가기</button>
</main>

<script>
const PASSWORD_REGEX=/^(?=.*\d).{8,15}$/;
const recoveryStatus=document.getElementById("recoveryStatus");
const resetPasswordForm=document.getElementById("resetPasswordForm");
const newPassword=document.getElementById("newPassword");
const newPasswordConfirm=document.getElementById("newPasswordConfirm");
const newPasswordCheckMsg=document.getElementById("newPasswordCheckMsg");
const resetPasswordBtn=document.getElementById("resetPasswordBtn");
const backToLoginBtn=document.getElementById("backToLoginBtn");

let recoveryReady=false;
let passwordUpdating=false;
let authSubscription=null;

function wait(ms){
    return new Promise(resolve=>setTimeout(resolve,ms));
}

function showResetPopup(){
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
        document.body.classList.add("reset-popup-visible");
    }));
}

async function leaveResetPage(target){
    document.body.classList.remove("reset-popup-visible");
    document.body.classList.add("reset-popup-closing");
    if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches){
        await wait(260);
    }
    location.replace(target);
}

function getRecoveryUrlValue(name){
    const url=new URL(window.location.href);
    const queryValue=url.searchParams.get(name);
    if(queryValue) return queryValue;
    const hashParams=new URLSearchParams(url.hash.replace(/^#/,""));
    return hashParams.get(name);
}

function setRecoveryState(message,type="normal"){
    recoveryStatus.textContent=message;
    recoveryStatus.classList.toggle("error",type==="error");
    recoveryStatus.classList.toggle("success",type==="success");
}

function clearRecoveryUrl(){
    try{
        const cleanUrl=new URL("./reset_password.html",window.location.href);
        history.replaceState(history.state,document.title,cleanUrl.pathname);
    }catch(_){ }
}

function activateRecoveryForm(){
    if(recoveryReady) return;
    recoveryReady=true;
    setRecoveryState("본인 확인이 완료되었습니다. 새 비밀번호를 설정해주세요.");
    resetPasswordForm.hidden=false;
    resetPasswordBtn.disabled=false;
    clearRecoveryUrl();
    setTimeout(()=>newPassword.focus(),80);
}

function showInvalidRecoveryLink(message="비밀번호 재설정 링크가 만료되었거나 올바르지 않습니다."){
    recoveryReady=false;
    resetPasswordForm.hidden=true;
    setRecoveryState(message,"error");
}

async function initializeRecovery(){
    const urlError=getRecoveryUrlValue("error_description") || getRecoveryUrlValue("error");
    if(urlError){
        showInvalidRecoveryLink("비밀번호 재설정 링크가 만료되었거나 올바르지 않습니다. 다시 요청해주세요.");
        return;
    }

    const {data:listenerData}=sb.auth.onAuthStateChange((event,session)=>{
        if(event==="PASSWORD_RECOVERY" && session){
            activateRecoveryForm();
        }
    });
    authSubscription=listenerData?.subscription || null;

    const code=new URL(window.location.href).searchParams.get("code");
    if(code){
        const {data,error}=await sb.auth.exchangeCodeForSession(code);
        if(!error && data?.session){
            activateRecoveryForm();
            return;
        }
    }

    for(let attempt=0;attempt<15 && !recoveryReady;attempt+=1){
        const {data:{session},error}=await getSession();
        if(!error && session){
            activateRecoveryForm();
            return;
        }
        await wait(120);
    }

    if(!recoveryReady){
        showInvalidRecoveryLink();
    }
}

function checkResetPasswordMatch(){
    if(newPasswordConfirm.value.length===0){
        newPasswordCheckMsg.style.visibility="hidden";
        return;
    }

    newPasswordCheckMsg.style.visibility=
        newPassword.value===newPasswordConfirm.value ? "hidden" : "visible";
}

newPassword.addEventListener("input",checkResetPasswordMatch);
newPasswordConfirm.addEventListener("input",checkResetPasswordMatch);

resetPasswordForm.addEventListener("submit",async event=>{
    event.preventDefault();
    if(passwordUpdating || !recoveryReady) return;

    if(!PASSWORD_REGEX.test(newPassword.value)){
        triggerToast("비밀번호는 8~15글자이며\n숫자를 포함해야 합니다.");
        newPassword.focus();
        return;
    }

    if(newPassword.value!==newPasswordConfirm.value){
        triggerToast("비밀번호가 일치하지 않습니다.");
        newPasswordConfirm.focus();
        return;
    }

    passwordUpdating=true;
    newPassword.disabled=true;
    newPasswordConfirm.disabled=true;
    resetPasswordBtn.disabled=true;
    resetPasswordBtn.textContent="변경 중...";

    try{
        const {error}=await updatePassword(newPassword.value);
        if(error) throw error;

        setRecoveryState("비밀번호가 변경되었습니다. 로그인 화면으로 이동합니다.","success");
        resetPasswordForm.hidden=true;
        try{await sb.auth.signOut({scope:"local"});}catch(_){ }
        await wait(700);
        await leaveResetPage("index.html?password_reset=success");
    }catch(error){
        console.error("비밀번호 변경 실패:",error);
        const message=String(error?.message||"").toLowerCase();
        if(message.includes("session") || message.includes("jwt") || message.includes("expired")){
            showInvalidRecoveryLink("비밀번호 재설정 링크가 만료되었습니다. 다시 요청해주세요.");
        }else if(
            (message.includes("password") && message.includes("different")) ||
            message.includes("same password") ||
            message.includes("old password") ||
            message.includes("password should not be the same")
        ){
            triggerToast("이전에 사용하던 비밀번호입니다.");
        }else{
            triggerToast(error?.message || "비밀번호를 변경하지 못했습니다.");
        }
    }finally{
        passwordUpdating=false;
        newPassword.disabled=false;
        newPasswordConfirm.disabled=false;
        resetPasswordBtn.disabled=!recoveryReady;
        resetPasswordBtn.textContent="비밀번호 변경";
    }
});

backToLoginBtn.addEventListener("click",async()=>{
    try{await sb.auth.signOut({scope:"local"});}catch(_){ }
    await leaveResetPage("index.html");
});

window.addEventListener("pagehide",()=>{
    try{authSubscription?.unsubscribe?.();}catch(_){ }
});

showResetPopup();
initializeRecovery();
</script>
</body>
</html>
